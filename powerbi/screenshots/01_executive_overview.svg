<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5F2"/><rect width="1280" height="74" fill="#2F3136"/><rect y="70" width="1280" height="4" fill="#B58A3B"/><text x="28" y="32" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">Jewelry Retail Performance</text><text x="28" y="52" font-family="Segoe UI,Arial" font-size="9" fill="#fff">Executive snapshot of sales scale, category mix and demand momentum</text><g font-family="Segoe UI,Arial"><g fill="#fff" stroke="#E4DED5"><rect x="18" y="90" rx="10" width="235" height="90"/><rect x="263" y="90" rx="10" width="235" height="90"/><rect x="508" y="90" rx="10" width="235" height="90"/><rect x="753" y="90" rx="10" width="235" height="90"/><rect x="998" y="90" rx="10" width="264" height="90"/></g><g fill="#6B6B6B" font-size="11"><text x="28" y="112">Gross Sales</text><text x="273" y="112">Orders</text><text x="518" y="112">Customers</text><text x="763" y="112">Avg. Order Value</text><text x="1008" y="112">Repeat Customer Rate</text></g><g font-size="28" font-weight="700"><text x="28" y="150" fill="#996B18">$33.18M</text><text x="273" y="150" fill="#222">74,760</text><text x="518" y="150" fill="#222">33,397</text><text x="763" y="150" fill="#996B18">$443.81</text><text x="1008" y="150" fill="#222">26.9%</text></g><g fill="#fff" stroke="#E4DED5"><rect x="18" y="198" rx="10" width="750" height="330"/><rect x="784" y="198" rx="10" width="478" height="157"/><rect x="784" y="371" rx="10" width="478" height="157"/><rect x="18" y="548" rx="10" width="1244" height="135"/></g><text x="28" y="220" font-size="14" font-weight="600">Monthly Gross Sales</text><polyline fill="none" stroke="#B58A3B" stroke-width="3" points="50,485 110,455 170,460 230,445 290,420 350,430 410,400 470,430 530,355 590,385 650,275 710,365 745,235"/><text x="798" y="220" font-size="14" font-weight="600">Revenue by Category</text><g fill="#6C7A89"><rect x="860" y="242" width="330" height="18"/><rect x="860" y="273" width="295" height="18"/><rect x="860" y="304" width="140" height="18"/></g><text x="798" y="393" font-size="14" font-weight="600">Revenue by RFM Segment</text><g fill="#B58A3B"><rect x="900" y="414" width="270" height="18"/><rect x="900" y="445" width="90" height="18"/><rect x="900" y="476" width="76" height="18"/></g><text x="30" y="574" font-size="15" font-weight="700" fill="#996B18">EXECUTIVE READOUT</text><text x="30" y="599" font-size="13" fill="#444">Earrings + Rings generate 65.9% of revenue, while 80.4% of sales come from items priced at $250+.</text><text x="30" y="622" font-size="13" fill="#444">Growth is driven mainly by order volume rather than a rising basket value.</text><text x="30" y="650" font-size="12" fill="#777">Interpretation: protect premium category depth, improve repeat purchase, and treat Dec 2021 as a partial month.</text></g></svg>