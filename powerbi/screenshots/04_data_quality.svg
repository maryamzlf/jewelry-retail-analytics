<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5F2"/><rect width="1280" height="74" fill="#2F3136"/><rect y="70" width="1280" height="4" fill="#B58A3B"/><g font-family="Segoe UI,Arial"><text x="24" y="32" font-size="22" font-weight="700" fill="#fff">Data Quality &amp; Audit</text><text x="24" y="52" font-size="9" fill="#fff">Transparent control layer for structural repair, missingness and duplicate traceability</text><g fill="#fff" stroke="#E4DED5"><rect x="10" y="88" rx="10" width="245" height="90"/><rect x="264" y="88" rx="10" width="245" height="90"/><rect x="518" y="88" rx="10" width="245" height="90"/><rect x="772" y="88" rx="10" width="245" height="90"/><rect x="1026" y="88" rx="10" width="244" height="90"/></g><g fill="#6B6B6B" font-size="11"><text x="20" y="112">Source Rows</text><text x="274" y="112">Structurally Repaired</text><text x="528" y="112">Missing Category</text><text x="782" y="112">Missing Gemstone</text><text x="1036" y="112">Duplicate-Group Rows</text></g><g font-size="28" font-weight="700"><text x="20" y="150" fill="#222">95,911</text><text x="274" y="150" fill="#996B18">5,352</text><text x="528" y="150" fill="#A55353">15.9%</text><text x="782" y="150" fill="#A55353">35.5%</text><text x="1036" y="150" fill="#996B18">5.1%</text></g><g fill="#fff" stroke="#E4DED5"><rect x="10" y="198" rx="10" width="613" height="214"/><rect x="640" y="198" rx="10" width="630" height="214"/><rect x="10" y="430" rx="10" width="613" height="235"/><rect x="640" y="430" rx="10" width="630" height="235"/></g><text x="20" y="222" font-size="14" font-weight="600">Revenue by Category — Taxonomy Exposure</text><g fill="#A55353"><rect x="85" y="246" width="485" height="20"/><rect x="85" y="279" width="438" height="20"/><rect x="85" y="312" width="198" height="20"/><rect x="85" y="345" width="126" height="20"/></g><g fill="#666" font-size="11"><text x="38" y="261">Earring</text><text x="52" y="294">Ring</text><text x="28" y="327">Unknown</text><text x="35" y="360">Bracelet</text></g><text x="650" y="222" font-size="14" font-weight="600">Duplicate Flag — Units Represented</text><rect x="820" y="250" width="122" height="125" fill="#B58A3B"/><rect x="1040" y="365" width="70" height="10" fill="#B58A3B"/><text x="848" y="397" font-size="11" fill="#666">False</text><text x="1052" y="397" font-size="11" fill="#666">True</text><text x="20" y="456" font-size="13" font-weight="700" fill="#996B18">ATTRIBUTE COMPLETENESS</text><g font-size="14" fill="#444"><text x="20" y="485">Gender missing   50.2%</text><text x="20" y="511">Gemstone missing   35.5%</text><text x="20" y="537">Category code missing   15.9%</text><text x="20" y="563">Brand code missing   10.6%</text><text x="20" y="589">Color missing   8.0%</text><text x="20" y="615">Metal missing   5.7%</text></g><text x="650" y="456" font-size="16" font-weight="700" fill="#996B18">AUDIT CONTROL NOTES</text><text x="650" y="486" font-size="14" fill="#555">5,352 malformed 11-field source rows are reconstructed before parsing,</text><text x="650" y="510" font-size="14" fill="#555">preventing price and customer IDs from shifting into incorrect columns.</text><text x="650" y="544" font-size="14" fill="#555">Exact duplicate groups are flagged rather than blindly removed because</text><text x="650" y="568" font-size="14" fill="#555">identical purchase lines may represent legitimate repeated units.</text><text x="650" y="602" font-size="14" fill="#555">Revenue is reconciled across category, metal, gemstone, price-band and RFM outputs.</text></g></svg>