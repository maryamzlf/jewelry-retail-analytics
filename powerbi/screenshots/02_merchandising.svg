<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5F2"/><rect width="1280" height="74" fill="#2F3136"/><rect y="70" width="1280" height="4" fill="#B58A3B"/><g font-family="Segoe UI,Arial"><text x="28" y="32" font-size="22" font-weight="700" fill="#fff">Merchandising &amp; Assortment</text><text x="28" y="52" font-size="9" fill="#fff">Interactive view of category economics, gemstone mix and SKU productivity</text><g fill="#fff" stroke="#E4DED5"><rect x="18" y="88" rx="10" width="300" height="58"/><rect x="330" y="88" rx="10" width="300" height="58"/><rect x="642" y="88" rx="10" width="300" height="58"/><rect x="954" y="88" rx="10" width="308" height="58"/></g><g font-size="11" fill="#222"><text x="30" y="109">Category</text><text x="342" y="109">Metal</text><text x="654" y="109">Gemstone</text><text x="966" y="109">Price Band</text></g><g fill="#777" font-size="12"><text x="30" y="134">All ▾</text><text x="342" y="134">All ▾</text><text x="654" y="134">All ▾</text><text x="966" y="134">All ▾</text></g><g fill="#fff" stroke="#E4DED5"><rect x="18" y="158" rx="10" width="300" height="88"/><rect x="330" y="158" rx="10" width="300" height="88"/><rect x="642" y="158" rx="10" width="300" height="88"/><rect x="954" y="158" rx="10" width="308" height="88"/></g><g fill="#6B6B6B" font-size="11"><text x="28" y="180">Portfolio Revenue</text><text x="340" y="180">Average Item Price</text><text x="652" y="180">Products</text><text x="964" y="180">Premium Revenue Share</text></g><g font-size="28" font-weight="700"><text x="28" y="218" fill="#996B18">$33.18M</text><text x="340" y="218" fill="#996B18">$345.94</text><text x="652" y="218" fill="#222">9,613</text><text x="964" y="218" fill="#996B18">80.4%</text></g><g fill="#fff" stroke="#E4DED5"><rect x="18" y="260" rx="10" width="610" height="192"/><rect x="642" y="260" rx="10" width="620" height="192"/><rect x="18" y="466" rx="10" width="610" height="194"/><rect x="642" y="466" rx="10" width="620" height="194"/></g><text x="28" y="284" font-size="14" font-weight="600">TOP SKU REVENUE LEADERS</text><g font-family="Consolas,monospace" font-size="12" fill="#333"><text x="30" y="310">1  180682…31042    Unknown    $247.5K    88 orders</text><text x="30" y="334">2  195666…54462    Unknown    $219.8K    95 orders</text><text x="30" y="358">3  195666…54461    Unknown    $201.4K   159 orders</text><text x="30" y="382">4  195666…62860    Unknown    $184.8K   107 orders</text><text x="30" y="406">5  131361…67859    Earring    $153.7K   170 orders</text></g><text x="652" y="284" font-size="14" font-weight="600">Revenue by Gemstone</text><g fill="#B58A3B"><rect x="790" y="306" width="330" height="20"/><rect x="790" y="338" width="190" height="20"/><rect x="790" y="370" width="50" height="20"/><rect x="790" y="402" width="38" height="20"/></g><g fill="#666" font-size="11"><text x="730" y="321">diamond</text><text x="742" y="353">mix</text><text x="742" y="385">topaz</text><text x="742" y="417">fianit</text></g><text x="28" y="490" font-size="14" font-weight="600">Average Selling Price by Category</text><g fill="#7D9184"><rect x="65" y="535" width="42" height="90"/><rect x="120" y="545" width="42" height="80"/><rect x="175" y="552" width="42" height="73"/><rect x="230" y="554" width="42" height="71"/><rect x="285" y="558" width="42" height="67"/><rect x="340" y="570" width="42" height="55"/><rect x="395" y="572" width="42" height="53"/><rect x="450" y="585" width="42" height="40"/></g><text x="654" y="492" font-size="15" font-weight="700" fill="#996B18">MERCHANDISING READOUT</text><text x="654" y="520" font-size="15" fill="#444">Premium pricing dominates the sales mix. Earrings and Rings form</text><text x="654" y="544" font-size="15" fill="#444">the commercial core, while Gold accounts for 98.5% of represented revenue.</text><text x="654" y="574" font-size="13" fill="#777">Data caveat: 14.3% of revenue is uncategorized, so assortment decisions</text><text x="654" y="596" font-size="13" fill="#777">should be paired with product-master governance.</text></g></svg>