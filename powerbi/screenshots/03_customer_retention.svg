<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5F2"/><rect width="1280" height="74" fill="#2F3136"/><rect y="70" width="1280" height="4" fill="#B58A3B"/><g font-family="Segoe UI,Arial"><text x="24" y="32" font-size="22" font-weight="700" fill="#fff">Customer Value &amp; Retention</text><text x="24" y="52" font-size="9" fill="#fff">RFM segmentation translating customer behavior into retention priorities</text><g fill="#fff" stroke="#E4DED5"><rect x="10" y="88" rx="10" width="245" height="90"/><rect x="264" y="88" rx="10" width="245" height="90"/><rect x="518" y="88" rx="10" width="245" height="90"/><rect x="772" y="88" rx="10" width="245" height="90"/><rect x="1026" y="88" rx="10" width="244" height="90"/></g><g fill="#6B6B6B" font-size="11"><text x="20" y="112">RFM Customers</text><text x="274" y="112">Repeat Customers</text><text x="528" y="112">Avg. Customer Value</text><text x="782" y="112">At Risk Revenue</text><text x="1036" y="112">Champions Revenue</text></g><g font-size="28" font-weight="700"><text x="20" y="150" fill="#222">33,397</text><text x="274" y="150" fill="#222">8,976</text><text x="528" y="150" fill="#996B18">$993.48</text><text x="782" y="150" fill="#A55353">$5.06M</text><text x="1036" y="150" fill="#996B18">$14.94M</text></g><g fill="#fff" stroke="#E4DED5"><rect x="10" y="196" rx="10" width="613" height="224"/><rect x="640" y="196" rx="10" width="630" height="224"/><rect x="10" y="438" rx="10" width="613" height="227"/><rect x="640" y="438" rx="10" width="630" height="227"/></g><text x="20" y="220" font-size="14" font-weight="600">Revenue by RFM Segment</text><g fill="#B58A3B"><rect x="135" y="245" width="350" height="20"/><rect x="135" y="278" width="120" height="20"/><rect x="135" y="311" width="100" height="20"/><rect x="135" y="344" width="85" height="20"/><rect x="135" y="377" width="65" height="20"/></g><g fill="#666" font-size="11"><text x="63" y="260">Champions</text><text x="83" y="293">At Risk</text><text x="42" y="326">Recent Customers</text><text x="25" y="359">Potential Loyalists</text><text x="50" y="392">Loyal Customers</text></g><text x="650" y="220" font-size="14" font-weight="600">Avg. Customer Lifetime Value by Segment</text><g fill="#6C7A89"><rect x="765" y="245" width="445" height="20"/><rect x="765" y="278" width="230" height="20"/><rect x="765" y="311" width="175" height="20"/><rect x="765" y="344" width="40" height="20"/><rect x="765" y="377" width="28" height="20"/></g><text x="20" y="462" font-size="13" font-weight="700">HIGHEST-VALUE CUSTOMERS</text><g font-family="Consolas,monospace" font-size="12" fill="#333"><text x="20" y="490">1  Customer …42977   Champions   $462.2K   777 orders</text><text x="20" y="516">2  Customer …18202   Champions   $286.0K   298 orders</text><text x="20" y="542">3  Customer …81731   Champions   $272.3K   559 orders</text><text x="20" y="568">4  Customer …99903   Champions   $261.5K   376 orders</text><text x="20" y="594">5  Customer …36725   Champions   $255.6K   448 orders</text></g><text x="650" y="465" font-size="16" font-weight="700" fill="#996B18">RETENTION PRIORITIES</text><text x="650" y="494" font-size="15" fill="#444">Champions are only 7.1% of customers but generate 45.0% of revenue.</text><text x="650" y="520" font-size="15" fill="#444">At Risk customers are 6.0% of customers yet hold 15.2% of historical revenue.</text><text x="650" y="554" font-size="14" fill="#777">Action: protect Champions with loyalty/VIP treatment, reactivate At Risk</text><text x="650" y="578" font-size="14" fill="#777">customers, and build a structured second-purchase journey for Recent Customers.</text></g></svg>